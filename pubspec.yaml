name: okf
description: A format-first Dart toolkit for reading, validating, writing, indexing, and graphing Open Knowledge Format bundles.
version: 0.5.0
repository: https://github.com/btwld/okf
issue_tracker: https://github.com/btwld/okf/issues
topics:
  - okf
  - knowledge
  - markdown
  - yaml
  - metadata

environment:
  sdk: ">=3.11.0 <4.0.0"

executables:
  okf:

dependencies:
  ack: ^1.2.0
  ack_annotations: ^1.2.0
  args: ^2.7.0
  crypto: ^3.0.7
  markdown: ^7.3.0
  mcp_dart: ^2.4.0
  path: ^1.9.1
  unorm_dart: ^0.3.2
  yaml: ^3.1.3

dev_dependencies:
  ack_generator: 1.2.0
  build_runner: ^2.10.0
  lints: ^4.0.0
  test: ^1.25.8
