name: Deploy Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # cli_pkg 2.15.2 uses the Dart 3.11-only xml 7 API; pinned for reproducibility.
  RELEASE_DART_SDK: "3.11.0"

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # exchanged by setup-dart for temporary pub.dev credentials
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          sdk-version: ${{ env.RELEASE_DART_SDK }}

      # cli_pkg hardcodes the release's tag_name to the bare pubspec version
      # and attaches every asset to that tag. Publish it at this commit first:
      # left to itself, GitHub invents the tag at the default branch head,
      # which is not necessarily what was tagged and tested. A prerelease
      # suffix is allowed: a release that depends on a prerelease must be one.
      - name: Tag the release commit with the bare version
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          version="${GITHUB_REF_NAME#v}"
          if git ls-remote --exit-code --tags origin "$version" >/dev/null; then
            echo "okf: $version already exists"
          else
            git tag "$version"
            git push origin "$version"
          fi

      - name: Get release tool dependencies
        working-directory: tool/release
        run: dart pub get --enforce-lockfile

      - name: Deploy Github
        working-directory: tool/release
        run: dart run grinder pkg-github-release

      - name: Deploy Github Linux
        working-directory: tool/release
        run: dart run grinder pkg-github-linux

      # The prepare action above dropped the credential so that dependency
      # resolution could talk to pub.dev unauthenticated. Mint a fresh one now
      # that every read is done. Same SDK as prepare, so this is a tool-cache
      # hit and only the token is refreshed; the cleanup guards the download
      # path that test.yml documents, in case the two versions ever diverge.
      - name: Clean Dart SDK temp files
        run: rm -f ${{ runner.temp }}/dartsdk-*.zip

      - name: Provision pub.dev OIDC credentials
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.RELEASE_DART_SDK }}
          problem-matcher: false

      # cli_pkg's pkg-pub-deploy only knows how to write a long-lived
      # PUB_CREDENTIALS file before publishing. setup-dart exchanged this job's
      # OIDC token for temporary pub.dev credentials, so publish directly and
      # keep no durable secret.
      #
      # --force skips the interactive confirmation, which a workflow cannot
      # answer. Validation runs: dart-lang/pub-dev#9576, which rejected
      # authenticated metadata reads with HTTP 403 and forced
      # --skip-validation here, is fixed upstream.
      - name: Deploy to Pub
        run: dart pub publish --force

  deploy-macos:
    name: Deploy macOS
    runs-on: macos-latest
    needs: release
    permissions:
      # pkg-github-macos uploads assets to the release the previous job
      # created, which is a write to repository contents.
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          sdk-version: ${{ env.RELEASE_DART_SDK }}

      - name: Get release tool dependencies
        working-directory: tool/release
        run: dart pub get --enforce-lockfile

      - name: Deploy Github Mac
        working-directory: tool/release
        run: dart run grinder pkg-github-macos

      - name: Deploy versioned formula
        working-directory: tool/release
        run: dart run grinder pkg-homebrew-update --versioned-formula
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GH_TOKEN }}

      # A prerelease gets only its versioned formula: `okf` stays on the
      # latest stable release. cli_pkg would also write the versioned formula
      # here for a prerelease, which the previous step already committed, and
      # fail on the empty commit.
      - name: Deploy Homebrew
        if: ${{ !contains(github.ref_name, '-') }}
        working-directory: tool/release
        run: dart run grinder pkg-homebrew-update
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GH_TOKEN }}
